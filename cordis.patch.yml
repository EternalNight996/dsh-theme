# 主题皮肤（dsh-theme）bundle 补丁层。
# 安装后由 package.json 的 dsh.bundle.patch 自动生效；后层
# （profile 自己的 cordis.patch.yml / --patch）可按 id 覆盖或禁用本行。
#
# 客户端 UI（背景层 + 设置 → 主题 + 侧边栏「🎨 主题」按钮）由 package.json 的
# dsh.client 元数据自动挂载，无需在此声明任何 client 行。

- insert:
    - id: dsh-theme
      # 必须是发布包名（scoped 全名）——loader 按此 specifier 从 profile 根 import，
      # 裸名 `dsh-theme` 会解析失败（ERR_MODULE_NOT_FOUND）。
      name: "@eternalnight/dsh-theme"
      config:
        enabled: true
        mode: image
        builtinId: deep-space
        imageSrc: '/dsh-theme/assets/import-images/default.png'
        imageFit: cover
        videoMode: follow
        videoSrc: '/dsh-theme/assets/import-videos/default.mp4'
        threeSceneId: 'metal-figure'
        threeInteract: true
        threeOrbitSpeed: 0.35
        threePointerRange: 0.4
        importedImages: []
        importedVideos: []
        dim: 0
        themeAlpha: 1
        dialogAlpha: 0
